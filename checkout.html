<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Al Madina Super Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="checkout"><header id="hd"></header><main>
<div class="wrap two" style="padding-top:2.5rem"><form id="form" class="card"><h1 style="font-size:28px">Delivery details</h1><label>Full name</label><input required><label>Phone / WhatsApp</label><input required type="tel"><label>Address</label><textarea required rows="3"></textarea><label>Delivery slot</label><select><option>Express 45 min</option><option>Today 4–6 PM</option><option>Tomorrow morning</option></select><label>Payment</label><select><option>Cash on delivery</option><option>Card on delivery</option></select><button class="btn" style="margin-top:1.5rem;width:100%">Place order</button></form><div class="card sum"><h3>Your order</h3><div id="ord"></div><p class="tot"><span>Total</span><span id="tt"></span></p></div></div>
</main><footer id="ft"></footer><script src="js/app.js"></script></body></html>
